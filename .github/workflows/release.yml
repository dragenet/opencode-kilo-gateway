name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # changesets/action creates commits/tags/releases
  pull-requests: write  # changesets/action opens the Version Packages PR
  id-token: write       # OIDC for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changesets needs full history to compute changes

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - run: yarn install --immutable
      - run: yarn compile
      - run: yarn test

      - name: Ensure a recent npm (OIDC support)
        run: npm install -g npm@latest

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          # `publish` is intentionally omitted: the actual npm publish happens
          # in a separate step below, using plain `npm publish --provenance --tag latest`
          # directly so npm's OIDC trusted-publishing flow is exercised
          # unambiguously (changesets/action's own publish path would shell
          # out via package-manager-detector to `yarn npm publish`, which has
          # no confirmed OIDC support).
          version: yarn changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (only when nothing left to version)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION already on npm, skipping publish"
          else
            npm publish --provenance --tag latest
          fi

      # Idempotent: creates the tag + release only if missing, so a re-run after a failed step completes it.
      - name: Ensure GitHub Release for the current version
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, skipping"
            exit 0
          fi
          NOTES=$(awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using a link instead"
            NOTES="See CHANGELOG.md."
          fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
