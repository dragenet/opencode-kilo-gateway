# PR checks: install, compile, test.
# dist/ is committed on purpose (OpenCode v2 installs git plugins with
# ignoreScripts, so it can't build on install) — fail if a PR forgot to
# rebuild and commit it.
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - run: yarn install --immutable
      - run: yarn compile

      - name: Check dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            git diff --stat dist/
            echo "::error::dist/ is out of date — run \`yarn compile\` and commit dist/"
            exit 1
          fi

      - run: yarn test
